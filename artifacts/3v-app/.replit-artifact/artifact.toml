kind = "web"
previewPath = "/"
title = "Voie, Vérité, Vie (3V)"
version = "1.0.0"
id = "artifacts/3v-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25698

[services.development]
run = "pnpm --filter @workspace/3v-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/3v-app", "run", "build" ]
publicDir = "artifacts/3v-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25698"
BASE_PATH = "/"
