name: Notifications automatiques

on:
  schedule:
    - cron: '0 6 * * *'   # 07h00 WAT (Cameroun) — Prière du matin
    - cron: '0 11 * * *'  # 12h00 WAT — Angelus
    - cron: '0 19 * * *'  # 20h00 WAT — Prière du soir
  workflow_dispatch:
    inputs:
      type:
        description: 'Type (morning / midday / evening / custom)'
        required: true
        default: 'morning'
      title:
        description: 'Titre (si type=custom)'
        required: false
      body:
        description: 'Message (si type=custom)'
        required: false
      url:
        description: "URL à ouvrir (si type=custom)"
        required: false
        default: '/'

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install firebase-admin @supabase/supabase-js

      - name: Envoyer les notifications FCM
        env:
          SUPABASE_URL: https://kaddsojhnkyfavaulrfc.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthZGRzb2pobmt5ZmF2YXVscmZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE3Njg1MjcsImV4cCI6MjA3NzM0NDUyN30.hFAbVxHmfDY1Xqkij62R8dTBfHw6ff5mSb3faq_4CPs
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_TYPE: ${{ inputs.type }}
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_BODY: ${{ inputs.body }}
          INPUT_URL: ${{ inputs.url }}
        run: |
          node --input-type=commonjs << 'SCRIPT'
          const admin = require('firebase-admin');
          const { createClient } = require('@supabase/supabase-js');

          // ── Initialiser Firebase Admin ────────────────────────────────────
          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);
          admin.initializeApp({ credential: admin.credential.cert(serviceAccount) });
          const messaging = admin.messaging();

          // ── Messages programmés ───────────────────────────────────────────
          const MESSAGES = {
            morning: {
              title: '🌅 Bonjour ! Que Dieu bénisse votre journée',
              body: 'Découvrez les lectures du jour et commencez avec une prière',
              url: '/biblical-reading',
              action: 'bible',
            },
            midday: {
              title: '☀️ Angelus — 12h',
              body: 'Un moment de recueillement au milieu de la journée',
              url: '/',
              action: 'general',
            },
            evening: {
              title: '🌙 Bonsoir ! Prière du soir',
              body: 'Terminez votre journée avec une prière et les vêpres',
              url: '/messe-office',
              action: 'general',
            },
          };

          // ── Déterminer le type ────────────────────────────────────────────
          let type = process.env.INPUT_TYPE || 'morning';
          const schedule = process.env.GITHUB_EVENT_SCHEDULE;
          if (schedule === '0 6 * * *')  type = 'morning';
          if (schedule === '0 11 * * *') type = 'midday';
          if (schedule === '0 19 * * *') type = 'evening';

          let payload;
          if (type === 'custom') {
            payload = {
              title: process.env.INPUT_TITLE || '🔔 Voie Vérité Vie',
              body: process.env.INPUT_BODY || '',
              url: process.env.INPUT_URL || '/',
              action: 'general',
            };
          } else {
            payload = MESSAGES[type] || MESSAGES.morning;
          }

          console.log(`Type: ${type} — "${payload.title}"`);

          // ── Récupérer les tokens depuis Supabase ──────────────────────────
          const supabase = createClient(
            process.env.SUPABASE_URL,
            process.env.SUPABASE_ANON_KEY,
          );
          const { data: rows, error } = await supabase
            .from('fcm_tokens')
            .select('token, user_id');

          if (error) {
            console.error('Erreur Supabase:', error.message);
            process.exit(1);
          }

          if (!rows || rows.length === 0) {
            console.log('Aucun token enregistré.');
            process.exit(0);
          }

          // ── Séparer FCM (strings) des Web Push (JSON avec endpoint) ──────
          const fcmTokens = [];
          for (const row of rows) {
            try {
              const parsed = JSON.parse(row.token);
              if (parsed.endpoint) continue; // Web Push subscription — ignorer
            } catch {
              // Pas du JSON → c'est un token FCM simple
              fcmTokens.push(row.token);
            }
          }

          console.log(`Tokens FCM : ${fcmTokens.length} / ${rows.length} total`);

          if (fcmTokens.length === 0) {
            console.log('Aucun token FCM — les utilisateurs doivent rouvrir l\'app pour migrer.');
            process.exit(0);
          }

          // ── Envoyer via Firebase Admin (par lots de 500) ─────────────────
          const BATCH = 500;
          let sent = 0, failed = 0;
          const expired = [];

          for (let i = 0; i < fcmTokens.length; i += BATCH) {
            const batch = fcmTokens.slice(i, i + BATCH);
            const message = {
              tokens: batch,
              notification: {
                title: payload.title,
                body: payload.body,
              },
              webpush: {
                notification: {
                  icon: '/icon-192x192.png',
                  badge: '/badge-72x72.png',
                  requireInteraction: false,
                  vibrate: [300, 100, 300],
                },
                fcmOptions: { link: payload.url },
                data: {
                  url: payload.url,
                  action: payload.action,
                },
              },
              android: {
                notification: {
                  icon: 'ic_notification',
                  color: '#7c3aed',
                  sound: 'default',
                  channelId: 'default',
                },
                priority: 'high',
              },
              apns: {
                payload: {
                  aps: { sound: 'default', badge: 1 },
                },
              },
            };

            const result = await messaging.sendEachForMulticast(message);
            sent += result.successCount;
            failed += result.failureCount;

            result.responses.forEach((resp, idx) => {
              if (!resp.success) {
                const code = resp.error?.code || '';
                if (
                  code.includes('registration-token-not-registered') ||
                  code.includes('invalid-registration-token')
                ) {
                  expired.push(batch[idx]);
                }
              }
            });
          }

          // ── Nettoyer les tokens expirés ───────────────────────────────────
          if (expired.length > 0) {
            await supabase.from('fcm_tokens').delete().in('token', expired);
            console.log(`${expired.length} token(s) expirés supprimés`);
          }

          console.log(`✅ Résultat: ${sent} envoyés, ${failed} échoués sur ${fcmTokens.length} appareils`);

          if (sent === 0 && fcmTokens.length > 0) process.exit(1);
          SCRIPT
