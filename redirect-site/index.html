<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0;url=https://voieveritevie.org">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voie Vérité Vie — Redirection</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d1b36;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: white;
      text-align: center;
      padding: 2rem;
    }
    .logo { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; color: #C9A84C; }
    p { font-size: 0.9rem; color: rgba(255,255,255,0.6); margin-bottom: 1.5rem; }
    a {
      display: inline-block;
      background: #C9A84C;
      color: #0d1b36;
      padding: 0.75rem 2rem;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
    }
    .spinner {
      width: 2rem; height: 2rem;
      border: 3px solid rgba(201,168,76,0.2);
      border-top-color: #C9A84C;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 1.5rem auto 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="logo">✝️</div>
  <h1>Voie, Vérité, Vie</h1>
  <p>L'application a déménagé vers son nouveau domaine.<br>Redirection automatique en cours…</p>
  <a href="https://voieveritevie.org">Accéder à l'application →</a>
  <div class="spinner"></div>

  <script>
    // Redirection immédiate
    window.location.replace('https://voieveritevie.org' + window.location.pathname + window.location.search);
  </script>
</body>
</html>
